<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - PDF Extractor</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="stylesheet"
        href="./css/auth.css"
    >

</head>

<body>

<header class="header">

    <div class="container header-content">

        <a
            href="./index.html"
            class="logo"
        >
            PDF Extractor
        </a>

        <nav class="nav">

            <a href="./index.html">
                Home
            </a>

            <a href="./documentation.html">
                Documentation
            </a>

            <a href="./register.html">
                Register
            </a>

        </nav>

    </div>

</header>


<main class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <span class="section-label">
                    Welcome back
                </span>

                <h1>
                    Login
                </h1>

                <p>
                    Login to access your PDF documents.
                </p>

            </div>


            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div
                    id="login-error"
                    class="form-error hidden"
                ></div>


                <button
                    type="submit"
                    class="button full-button"
                    id="login-button"
                >
                    Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="./register.html">
                        Create one
                    </a>
                </p>

            </div>

        </div>

    </div>

</main>


<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/login.js"></script>

</body>

</html>
